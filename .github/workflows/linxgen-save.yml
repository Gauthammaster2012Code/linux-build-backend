name: LinxGen save
run-name: LinxGen save ${{ inputs.save_attempt_id }}

# Started only by the LinxGen GitHub App through workflow_dispatch. Copies a finished build's files from
# temporary storage to a release in the member's own storage repository. The runner proves its identity with
# a GitHub OIDC token for this workflow file plus the per-attempt dispatch nonce; the backend then hands it
# short-lived download URLs and a token limited to the member's storage repository.
on:
  workflow_dispatch:
    inputs:
      save_attempt_id:
        description: LinxGen save attempt id
        required: true
        type: string
      dispatch_nonce:
        description: Per-attempt dispatch nonce
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: linxgen-save-${{ inputs.save_attempt_id }}
  cancel-in-progress: false

jobs:
  save:
    name: Save to GitHub
    # Repository variable LINXGEN_SAVE_RUNNER_LABELS (JSON) selects other runners; defaults to the free hosted runner.
    runs-on: ${{ fromJSON(vars.LINXGEN_SAVE_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    # Must stay above the backend's save deadline (TIMING.saveTimeoutMs, 110 minutes) so the backend decides how a
    # slow save ends.
    timeout-minutes: 120
    steps:
      - name: Validate inputs
        env:
          SAVE_ATTEMPT_ID: ${{ inputs.save_attempt_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          [[ "$SAVE_ATTEMPT_ID" =~ ^[A-Za-z0-9]{1,64}$ ]] || { echo "invalid save_attempt_id"; exit 1; }
          [[ "$DISPATCH_NONCE" =~ ^[A-Za-z0-9_-]{32,128}$ ]] || { echo "invalid dispatch_nonce"; exit 1; }
          echo "::add-mask::$DISPATCH_NONCE"

      - name: Check out runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Build runner client
        run: |
          pnpm install --frozen-lockfile --filter @linxgen/runner...
          pnpm --filter @linxgen/runner build

      # Build files are downloaded in full before upload; hosted runners need the extra room for large ISOs.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"

      - name: Save build files
        env:
          LINXGEN_API_URL: ${{ vars.LINXGEN_API_URL }}
          LINXGEN_OIDC_AUDIENCE: ${{ vars.LINXGEN_OIDC_AUDIENCE || 'linxgen-runner' }}
          LINXGEN_SAVE_ATTEMPT_ID: ${{ inputs.save_attempt_id }}
          LINXGEN_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: node packages/runner/dist/runner.mjs
