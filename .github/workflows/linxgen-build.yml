name: LinxGen build
run-name: LinxGen attempt ${{ inputs.attempt_id }}

# Started only by the LinxGen GitHub App through workflow_dispatch. The runner proves its identity to the
# backend with a GitHub OIDC token plus the per-attempt dispatch nonce, then receives a scoped capability.
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: LinxGen attempt id
        required: true
        type: string
      dispatch_nonce:
        description: Per-attempt dispatch nonce
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: linxgen-attempt-${{ inputs.attempt_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    # Repository variable LINXGEN_RUNNER_LABELS (JSON) selects larger or self-hosted runners; defaults to the free hosted runner.
    runs-on: ${{ fromJSON(vars.LINXGEN_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    # Must stay above the backend's maximum build timeout (MAX_BUILD_TIMEOUT_MINUTES, 330) plus upload/finish
    # headroom so the backend deadline, not the job timeout, decides how a long build ends.
    timeout-minutes: 360
    steps:
      - name: Validate inputs
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          [[ "$ATTEMPT_ID" =~ ^[A-Za-z0-9]{1,64}$ ]] || { echo "invalid attempt_id"; exit 1; }
          [[ "$DISPATCH_NONCE" =~ ^[A-Za-z0-9_-]{32,128}$ ]] || { echo "invalid dispatch_nonce"; exit 1; }
          echo "::add-mask::$DISPATCH_NONCE"

      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Build runner client
        run: |
          pnpm install --frozen-lockfile --filter @linxgen/runner...
          pnpm --filter @linxgen/runner build

      # Only hosted runners are disposable; on self-hosted machines these paths and images belong to the operator.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Build, verify and upload
        env:
          LINXGEN_API_URL: ${{ vars.LINXGEN_API_URL }}
          LINXGEN_OIDC_AUDIENCE: ${{ vars.LINXGEN_OIDC_AUDIENCE || 'linxgen-runner' }}
          LINXGEN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          LINXGEN_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: node packages/runner/dist/runner.mjs
